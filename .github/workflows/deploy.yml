name: Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      WORKER_NAME: poolscoreboard

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required Actions secrets
        run: |
          missing_secrets=()

          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing_secrets+=("CLOUDFLARE_API_TOKEN")
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing_secrets+=("CLOUDFLARE_ACCOUNT_ID")
          [ -n "$ADMIN_PASSWORD" ] || missing_secrets+=("ADMIN_PASSWORD")

          if [ ${#missing_secrets[@]} -gt 0 ]; then
            echo "Error: missing required GitHub Actions secrets: ${missing_secrets[*]}"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Ensure remote D1 exists
        run: npm run db:ensure:remote

      - name: Write resolved D1 id into Wrangler config
        run: |
          node --input-type=module <<'EOF'
          import { readFileSync, writeFileSync } from "node:fs";

          const configPath = "wrangler.jsonc";
          const databaseId = process.env.CLOUDFLARE_D1_DATABASE_ID;

          if (!databaseId) {
            throw new Error("Missing CLOUDFLARE_D1_DATABASE_ID after db:ensure:remote");
          }

          const originalConfig = readFileSync(configPath, "utf8");
          const updatedConfig = originalConfig.replace(
            /("database_id"\s*:\s*")[^"]+(")/,
            `$1${databaseId}$2`,
          );

          if (updatedConfig === originalConfig) {
            throw new Error(`Failed to update ${configPath} with the resolved D1 database id`);
          }

          writeFileSync(configPath, updatedConfig);
          console.log(`Updated ${configPath} to use remote D1 database ${databaseId}`);
          EOF

      - name: Upload worker admin password secret
        run: printf '%s' "$ADMIN_PASSWORD" | npx wrangler secret put ADMIN_PASSWORD --name "$WORKER_NAME"

      - name: Apply D1 migrations
        run: npm run db:migrate:remote

      - name: Sync remote admin password
        run: node scripts/sync-remote-admin.mjs

      - name: Deploy Worker
        run: npm run deploy
