name: Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PROJECT_NAME: ${{ github.event.repository.name }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required Actions secrets
        run: |
          missing_secrets=()

          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing_secrets+=("CLOUDFLARE_API_TOKEN")
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing_secrets+=("CLOUDFLARE_ACCOUNT_ID")
          [ -n "$ADMIN_PASSWORD" ] || missing_secrets+=("ADMIN_PASSWORD")

          if [ ${#missing_secrets[@]} -gt 0 ]; then
            echo "Error: missing required GitHub Actions secrets: ${missing_secrets[*]}"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync project naming
        run: npm run sync:project

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Ensure remote D1 exists
        run: npm run db:ensure:remote

      - name: Rebuild project config with remote D1 id
        run: npm run sync:project

      - name: Upload worker admin password secret
        run: printf '%s' "$ADMIN_PASSWORD" | npx wrangler secret put ADMIN_PASSWORD --name "$PROJECT_NAME"

      - name: Apply D1 migrations
        run: npm run db:migrate:remote

      - name: Sync remote admin password
        run: node scripts/sync-remote-admin.mjs

      - name: Deploy Worker
        run: npm run deploy
